services:
  - type: web
    name: smartcampus-backend
    env: node
    buildCommand: npm install && npm run build:server
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # In the Render dashboard, set:
      # SUPABASE_URL = https://ursquqpgofituzvhwmhk.supabase.co
      # SUPABASE_SERVICE_ROLE_KEY = your secret service role key (bypasses RLS)
      # GEMINI_API_KEY = your Google AI Studio API key (starts with AIza)
